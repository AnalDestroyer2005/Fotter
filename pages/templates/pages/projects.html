{% extends "pages/base.html" %}
{% load static %}
{% block title %}Главная — Fotter{% endblock %}

{% block content %}
<main class="wrap">
  <aside class="sidebar">
    <h3>Категории</h3>
    <nav id="cat-list" class="cat-list">
      <!-- Категории подставятся из /api/categories/ -->
      <a class="cat active" href="#" data-id="">Все</a>
    </nav>
  </aside>

  <section class="content">
    <div id="spinner" style="display:none">Загрузка…</div>
    <div id="error" class="error" style="display:none"></div>

    <!-- сетка карточек: под твои классы cards1/card1 -->
    <div id="projects-grid" class="cards1"></div>

    <div id="pagination" class="pager"></div>
  </section>
</main>

<!-- Скрипт подгрузки проектов/категорий -->
<script defer src="{% static 'pages/js/projects.js' %}"></script>
{% endblock %}
