{% extends "pages/base.html" %}
{% load static %}
{% block title %}Аккаунт — FOTTER{% endblock %}

{% block content %}
<main class="wrap">
  <div class="account-page">

    <!-- ЛЕВАЯ КОЛОНКА: карточка пользователя -->
    <aside class="account-side card">
      <div class="avatar-box">
        <img id="acct-avatar" class="avatar-xxl" src="{% static 'pages/img/avatar_default.png' %}" alt="avatar">
      </div>

      <div class="uinfo">
        <h3 id="acct-name" class="uname">—</h3>
        <div id="acct-username" class="muted">@—</div>
        <div id="acct-email" class="muted">—</div>
      </div>

      <button id="logout" class="btn btn-ghost full">Выйти</button>
    </aside>

    <!-- ПРАВАЯ КОЛОНКА: вкладки и панели -->
    <section class="account-main">
      <nav class="tabs">
        <button class="tab active" data-tab="profile">Профиль</button>
        <button class="tab" data-tab="skills">Навыки</button>
      </nav>

      <!-- PANEL: Профиль -->
      <section class="panel active card" id="panel-profile">
        <form id="form-profile" class="stack">
          <div class="split-2">
            <label class="field">
              <span class="label">Имя</span>
              <input id="first_name" name="first_name" placeholder="Имя">
            </label>
            <label class="field">
              <span class="label">Фамилия</span>
              <input id="last_name" name="last_name" placeholder="Фамилия">
            </label>
          </div>

          <label class="field">
            <span class="label">О себе</span>
            <textarea id="bio" name="bio" rows="4" placeholder="Кратко о себе"></textarea>
          </label>

          <div class="row space-between">
            <span id="prof-hint" class="hint"></span>
            <button type="submit" class="btn">Сохранить</button>
          </div>
        </form>
      </section>

      <!-- PANEL: Навыки -->
      <section class="panel card" id="panel-skills">
        <div class="stack">
          <p class="muted">Отметь навыки из справочника. Можно несколько.</p>

          <div id="skills-selected" class="skills selected"></div>

          <div class="skills-pool">
            <input id="skill-search" class="input" placeholder="Поиск навыков…">
            <div id="skills-pool" class="skills"></div>
          </div>

          <div class="row space-between">
            <span id="skills-hint" class="hint"></span>
            <button id="btn-save-skills" class="btn">Сохранить навыки</button>
          </div>
        </div>
      </section>
    </section>

  </div>
</main>

{% block extra_head %}
<link rel="stylesheet" href="{% static 'pages/css/account.css' %}">
<script defer src="{% static 'pages/js/account.js' %}"></script>
{% endblock %}
{% endblock %}
